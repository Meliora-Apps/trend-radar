name: publish-online

# Dupa fiecare colectare (si la cerere): data/ -> export -> Convex (varianta online de pe Vercel).
on:
  workflow_run:
    workflows: [daily-collect]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-online
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # local.db pastrat intre rulari: se importa doar zilele noi.
      - uses: actions/cache@v4
        with:
          path: local.db
          key: localdb-${{ github.run_id }}
          restore-keys: localdb-
      - name: Publicare in Convex
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          if [ -z "$CONVEX_SITE_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "Secretele CONVEX_SITE_URL / INGEST_SECRET nu sunt setate: sar peste publicare."; exit 0
          fi
          node src/export/publish.js
